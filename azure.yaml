name: telnyx-mcp-server
metadata:
  template: telnyx-mcp-server-remote@1.0.0
services:
  web:
    project: .
    language: python
    host: appservice
    hooks:
      prepackage:
        windows:
          shell: pwsh
          run: uv pip compile pyproject.toml -o requirements.txt
        posix:
          shell: sh
          run: uv pip compile pyproject.toml -o requirements.txt
