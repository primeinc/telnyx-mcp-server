name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - staging
      - develop
      - feature/remote-mcp-server
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  id-token: write

jobs:
  determine-environment:
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.set-env.outputs.environment }}
      log-level: ${{ steps.set-env.outputs.log-level }}
      pii-redaction: ${{ steps.set-env.outputs.pii-redaction }}
    steps:
      - id: set-env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "environment=production" >> $GITHUB_OUTPUT
            echo "log-level=WARNING" >> $GITHUB_OUTPUT
            echo "pii-redaction=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/staging" ]]; then
            echo "environment=staging" >> $GITHUB_OUTPUT
            echo "log-level=INFO" >> $GITHUB_OUTPUT
            echo "pii-redaction=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "log-level=DEBUG" >> $GITHUB_OUTPUT
            echo "pii-redaction=false" >> $GITHUB_OUTPUT
          else
            echo "environment=development" >> $GITHUB_OUTPUT
            echo "log-level=DEBUG" >> $GITHUB_OUTPUT
            echo "pii-redaction=false" >> $GITHUB_OUTPUT
          fi

  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "src/uv.lock"

    - name: Generate requirements.txt for Azure deployment
      run: |
        cd src && uv pip compile pyproject.toml -o requirements.txt
        echo "Generated requirements.txt for Azure App Service deployment"
        # Verify the requirements.txt was created properly
        if [ ! -f requirements.txt ]; then
          echo "Error: requirements.txt was not generated"
          exit 1
        fi
        echo "Requirements.txt size: $(wc -l < requirements.txt) lines"

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: python-app
        path: |
          src/
          azure.yaml
          infra/

  deploy:
    runs-on: ubuntu-latest
    needs: [build, determine-environment]
    environment:
      name: ${{ needs.determine-environment.outputs.environment }}
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Get deployed web app name
      id: get-webapp-name
      run: |
        # Get the resource group name based on environment
        RG_NAME="rg-${{ needs.determine-environment.outputs.environment }}"

        # Get the web app name from the resource group
        WEBAPP_NAME=$(az webapp list --resource-group "$RG_NAME" -o json | jq -r '.[] | select(.tags."azd-service-name"=="web") | .name')

        if [ -z "$WEBAPP_NAME" ]; then
          echo "Error: No web app found in resource group $RG_NAME"
          exit 1
        fi

        echo "WEBAPP_NAME=$WEBAPP_NAME" >> $GITHUB_OUTPUT
        echo "Found web app: $WEBAPP_NAME"

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ steps.get-webapp-name.outputs.WEBAPP_NAME }}
        slot-name: ${{ needs.determine-environment.outputs.environment }}

    - name: Configure App Settings
      uses: azure/appservice-settings@v1
      with:
        app-name: ${{ steps.get-webapp-name.outputs.WEBAPP_NAME }}
        app-settings-json: |
          [
            {"name": "TELNYX_API_KEY", "value": "${{ secrets.TELNYX_API_KEY }}"},
            {"name": "JWT_SECRET_KEY", "value": "${{ secrets.JWT_SECRET_KEY }}"},
            {"name": "AZURE_CLIENT_ID", "value": "${{ secrets.AZURE_OAUTH_CLIENT_ID }}"},
            {"name": "AZURE_TENANT_ID", "value": "${{ secrets.AZURE_TENANT_ID }}"},
            {"name": "AZURE_REDIRECT_URI", "value": "https://${{ steps.get-webapp-name.outputs.WEBAPP_NAME }}.azurewebsites.net/auth/callback"},
            {"name": "ENVIRONMENT", "value": "${{ needs.determine-environment.outputs.environment }}"},
            {"name": "LOG_LEVEL", "value": "${{ needs.determine-environment.outputs.log-level }}"},
            {"name": "ENABLE_PII_REDACTION", "value": "${{ needs.determine-environment.outputs.pii-redaction }}"},
            {"name": "MCP_ALLOWED_ORIGINS", "value": "https://claude.ai,https://chat.anthropic.com"},
            {"name": "REDIS_URL", "value": "${{ secrets.REDIS_URL }}"},
            {"name": "USE_REDIS", "value": "true"},
            {"name": "APPLICATION_INSIGHTS_KEY", "value": "${{ secrets.APPLICATION_INSIGHTS_KEY }}"},
            {"name": "GIT_COMMIT_HASH", "value": "${{ github.sha }}"},
            {"name": "WEBSITE_RUN_FROM_PACKAGE", "value": "0"},
            {"name": "WEBSITES_CONTAINER_START_TIME_LIMIT", "value": "1800"},
            {"name": "WEBSITES_ENABLE_APP_SERVICE_STORAGE", "value": "false"},
            {"name": "WEBSITE_WEBDEPLOY_USE_SCM", "value": "true"},
            {"name": "SCM_DO_BUILD_DURING_DEPLOYMENT", "value": "true"},
            {"name": "ENABLE_ORYX_BUILD", "value": "true"}
          ]
        general-settings-json: |
          {
            "linuxFxVersion": "PYTHON|3.11"
          }

    - name: Create deployment logs directory
      run: |
        mkdir -p .github/actions/deploy-logs

    - name: Save deployment logs
      run: |
        echo "Deployment completed at $(date)" > .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "App URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "Git Commit: ${{ github.sha }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "Deployed by: ${{ github.actor }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "Workflow run: ${{ github.run_id }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log

    - name: Upload deployment logs
      uses: actions/upload-artifact@v4
      with:
        name: deployment-logs-${{ github.sha }}
        path: .github/actions/deploy-logs/
        retention-days: 30

    - name: Wait for deployment to be ready
      run: |
        echo "Waiting for deployment to be ready..."
        WEBAPP_URL="${{ steps.deploy-to-webapp.outputs.webapp-url }}"
        MAX_ATTEMPTS=30
        SLEEP_TIME=10

        for i in $(seq 1 $MAX_ATTEMPTS); do
          echo "Attempt $i/$MAX_ATTEMPTS..."
          if curl -s -o /dev/null -w "%{http_code}" "${WEBAPP_URL}/health" | grep -q "200"; then
            echo "Application is ready!"
            break
          fi

          if [ $i -eq $MAX_ATTEMPTS ]; then
            echo "Application failed to become ready after $((MAX_ATTEMPTS * SLEEP_TIME)) seconds"
            exit 1
          fi

          echo "Application not ready yet, waiting ${SLEEP_TIME}s..."
          sleep $SLEEP_TIME
        done

    - name: Test deployed application
      run: |
        echo "Testing deployed application at ${{ steps.deploy-to-webapp.outputs.webapp-url }}"
        WEBAPP_URL="${{ steps.deploy-to-webapp.outputs.webapp-url }}"

        # Test health endpoint
        echo "Testing health endpoint..."
        curl -f "${WEBAPP_URL}/health" | jq . || (echo "Health check failed"; exit 1)

        # Test OAuth metadata
        echo "Testing OAuth metadata endpoint..."
        curl -f "${WEBAPP_URL}/.well-known/oauth-authorization-server" | jq . || (echo "OAuth metadata check failed"; exit 1)

        # Test MCP metadata
        echo "Testing MCP metadata endpoint..."
        curl -f "${WEBAPP_URL}/.well-known/mcp-oauth-metadata" | jq . || (echo "MCP metadata check failed"; exit 1)

        echo "All deployment tests passed successfully!"
