name: Remote Server Tests

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'src/telnyx_mcp_server/remote/**'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/remote-server-tests.yml'

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Check if remote server files changed
      id: check
      run: |
        # Check if this is a PR and if remote server files were changed
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          # Fetch the base branch to compare changes
          git fetch origin ${{ github.base_ref }} --depth=1
          # Check for changes in the specified paths
          if git diff --name-only origin/${{ github.base_ref }} | grep -E '^src/telnyx_mcp_server/remote/|^pyproject.toml$|^uv.lock$|^\.github/workflows/remote-server-tests.yml$'; then
            echo "should-run=true" >> $GITHUB_OUTPUT
            echo "✅ Running tests for remote server changes in PR"
          else
            echo "should-run=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Skipping tests - no relevant file changes detected"
          fi
        else
          echo "should-run=false" >> $GITHUB_OUTPUT
          echo "ℹ️ Skipping tests - not a pull request"
        fi

  test:
    needs: validate
    if: needs.validate.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: |
        uv sync --frozen --all-extras

    - name: Validate environment setup
      env:
        TELNYX_API_KEY: dummy-key-for-testing
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        echo "✅ Python version: $(python --version)"
        echo "✅ Current directory: $(pwd)"
        echo "✅ PYTHONPATH: $PYTHONPATH"
        echo "✅ Environment variables set"
        ls -la src/telnyx_mcp_server/remote/

    - name: Test remote server imports and functionality
      env:
        TELNYX_API_KEY: dummy-key-for-testing
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        cd ${{ github.workspace }}
        echo "Running remote server test script..."
        uv run scripts/test_remote_server.py

    - name: Test FastAPI app initialization
      env:
        TELNYX_API_KEY: dummy-key-for-testing
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        echo "Testing FastAPI app initialization..."
        uv run python -c "
        import sys
        sys.path.insert(0, 'src')
        from telnyx_mcp_server.remote.server import app
        print('✅ FastAPI app imports successfully')
        print(f'✅ App type: {type(app)}')
        "

    - name: Check OAuth and MCP endpoints
      env:
        TELNYX_API_KEY: dummy-key-for-testing
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        echo "Checking OAuth and MCP endpoints..."
        uv run python -c "
        import sys
        sys.path.insert(0, 'src')
        from telnyx_mcp_server.remote.server import app
        routes = [r.path for r in app.routes]

        # Check for core OAuth and MCP endpoints that should exist
        required = ['/auth/callback', '/mcp', '/authorize', '/token']
        missing = [r for r in required if r not in routes]
        if missing:
            print(f'❌ Missing required routes: {missing}')
            exit(1)
        else:
            print('✅ All required OAuth and MCP routes present')

        # List available routes for debugging
        print(f'📋 Available routes: {sorted(set(routes))}')

        # Additional validation
        print(f'✅ Total routes found: {len(set(routes))}')
        "

    - name: Test server configuration
      env:
        TELNYX_API_KEY: dummy-key-for-testing
        PYTHONPATH: ${{ github.workspace }}/src
      run: |
        echo "Testing server configuration..."
        uv run python -c "
        import sys
        sys.path.insert(0, 'src')
        from telnyx_mcp_server.remote.server import TelnyxMCPServer

        # Test server initialization
        server = TelnyxMCPServer()
        print('✅ TelnyxMCPServer initializes successfully')
        print(f'✅ Server tools available: {len(server.tools)}')
        "

  summary:
    needs: [validate, test]
    if: always()
    runs-on: ubuntu-latest

    steps:
    - name: Test Results Summary
      run: |
        echo "## Remote Server Tests Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY

        if [ "${{ needs.validate.result }}" = "success" ] && [ "${{ needs.test.result }}" = "success" ]; then
          echo "✅ **All tests passed successfully!**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- Remote server imports and initializes correctly" >> $GITHUB_STEP_SUMMARY
          echo "- FastAPI application loads without errors" >> $GITHUB_STEP_SUMMARY
          echo "- All required OAuth and MCP endpoints are present" >> $GITHUB_STEP_SUMMARY
          echo "- Server configuration is valid" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.validate.outputs.should-run }}" = "false" ]; then
          echo "ℹ️ **Tests were skipped** - No remote server changes detected" >> $GITHUB_STEP_SUMMARY
        elif [ "${{ needs.test.result }}" = "failure" ]; then
          echo "❌ **Tests failed!** Please check the test logs above." >> $GITHUB_STEP_SUMMARY
          exit 1
        else
          echo "⚠️ **Unexpected test result**" >> $GITHUB_STEP_SUMMARY
          echo "Validation: ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          echo "Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
        fi
