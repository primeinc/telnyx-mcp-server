version: 1

pre-build: |
  echo "==========================================="
  echo "Starting Oryx build for telnyx-mcp-server"
  echo "==========================================="
  echo "Build timestamp: $(date -u)"
  echo "Build ID: $BUILD_ID"
  echo "Repository: $GITHUB_REPOSITORY"
  echo "Commit SHA: $GIT_COMMIT_HASH"
  echo "Environment: $ENVIRONMENT"
  echo "Python version: $(python --version)"
  echo "Pip version: $(pip --version)"
  echo "Working directory: $(pwd)"
  echo "Directory contents:"
  ls -la
  # Requirements.txt is already generated by GitHub Actions workflow
  if [ -f requirements.txt ]; then
    echo "Found requirements.txt ($(wc -l < requirements.txt) lines)"
    echo "First 10 lines of requirements.txt:"
    head -10 requirements.txt
  else
    echo "ERROR: requirements.txt not found!"
    exit 1
  fi
  # Log environment variables
  echo "==========================================="
  echo "Environment variables:"
  echo "ORYX_BUILD_VERBOSE: $ORYX_BUILD_VERBOSE"
  echo "SCM_TRACE_LEVEL: $SCM_TRACE_LEVEL"
  echo "PYTHON_ENABLE_GUNICORN_MULTIWORKERS: $PYTHON_ENABLE_GUNICORN_MULTIWORKERS"
  echo "ENABLE_ORYX_BUILD: $ENABLE_ORYX_BUILD"
  echo "==========================================="

post-build: |
  echo "==========================================="
  echo "Build completed successfully"
  echo "==========================================="
  echo "Completion timestamp: $(date -u)"
  echo "Installed packages:"
  pip list
  echo "==========================================="
  echo "Directory structure after build:"
  find . -path ./antenv -prune -o -type f -name '*.py' -print
  echo "==========================================="

run: gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --access-logfile - --error-logfile - --log-level debug telnyx_mcp_server.remote.server:app
