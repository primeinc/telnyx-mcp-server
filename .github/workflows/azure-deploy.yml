name: Deploy to Azure App Service

on:
  push:
    branches:
      - main
      - feature/remote-mcp-server
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"

    - name: Install dependencies
      run: |
        uv sync --frozen --no-dev

    - name: Upload artifact for deployment
      uses: actions/upload-artifact@v4
      with:
        name: python-app
        path: |
          .
          !.venv/
          !.git/
          !.github/
          !tests/
          !scripts/
          !uv.lock

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}

    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: python-app
        path: .

    - name: Login to Azure
      uses: azure/login@v2
      with:
        client-id: ${{ secrets.AZURE_CLIENT_ID }}
        tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v3
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        slot-name: 'production'

    - name: Configure App Settings
      uses: azure/appservice-settings@v1
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        app-settings-json: |
          [
            {"name": "TELNYX_API_KEY", "value": "${{ secrets.TELNYX_API_KEY }}"},
            {"name": "JWT_SECRET_KEY", "value": "${{ secrets.JWT_SECRET_KEY }}"},
            {"name": "AZURE_CLIENT_ID", "value": "${{ secrets.AZURE_CLIENT_ID }}"},
            {"name": "AZURE_CLIENT_SECRET", "value": "${{ secrets.AZURE_CLIENT_SECRET }}"},
            {"name": "AZURE_TENANT_ID", "value": "${{ secrets.AZURE_TENANT_ID }}"},
            {"name": "AZURE_REDIRECT_URI", "value": "https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/auth/callback"},
            {"name": "ENVIRONMENT", "value": "production"},
            {"name": "LOG_LEVEL", "value": "INFO"},
            {"name": "ENABLE_PII_REDACTION", "value": "true"},
            {"name": "MCP_ALLOWED_ORIGINS", "value": "https://claude.ai,https://chat.anthropic.com"},
            {"name": "REDIS_URL", "value": "${{ secrets.REDIS_URL }}"},
            {"name": "USE_REDIS", "value": "true"},
            {"name": "APPLICATION_INSIGHTS_KEY", "value": "${{ secrets.APPLICATION_INSIGHTS_KEY }}"},
            {"name": "GIT_COMMIT_HASH", "value": "${{ github.sha }}"},
            {"name": "WEBSITE_RUN_FROM_PACKAGE", "value": "1"},
            {"name": "WEBSITES_CONTAINER_START_TIME_LIMIT", "value": "1800"},
            {"name": "WEBSITES_ENABLE_APP_SERVICE_STORAGE", "value": "false"},
            {"name": "WEBSITE_WEBDEPLOY_USE_SCM", "value": "true"}
          ]
        general-settings-json: |
          {
            "appCommandLine": "gunicorn -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --timeout 600 --chdir src --access-logfile - --error-logfile - --log-level info telnyx_mcp_server.remote.server:app",
            "linuxFxVersion": "PYTHON|3.11"
          }

    - name: Create deployment logs directory
      run: |
        mkdir -p .github/actions/deploy-logs

    - name: Save deployment logs
      run: |
        echo "Deployment completed at $(date)" > .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "App URL: ${{ steps.deploy-to-webapp.outputs.webapp-url }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "Git Commit: ${{ github.sha }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "Deployed by: ${{ github.actor }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log
        echo "Workflow run: ${{ github.run_id }}" >> .github/actions/deploy-logs/deploy-${{ github.sha }}.log

    - name: Upload deployment logs
      uses: actions/upload-artifact@v4
      with:
        name: deployment-logs-${{ github.sha }}
        path: .github/actions/deploy-logs/
        retention-days: 30

    - name: Test deployed application
      run: |
        echo "Testing deployed application at ${{ steps.deploy-to-webapp.outputs.webapp-url }}"

        # Test health endpoint
        curl -f "${{ steps.deploy-to-webapp.outputs.webapp-url }}/health" | jq .

        # Test OAuth metadata
        curl -f "${{ steps.deploy-to-webapp.outputs.webapp-url }}/.well-known/oauth-authorization-server" | jq .

        # Test MCP metadata
        curl -f "${{ steps.deploy-to-webapp.outputs.webapp-url }}/.well-known/mcp-oauth-metadata" | jq .

        echo "Basic deployment tests passed"
